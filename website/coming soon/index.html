<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MIA — Mesh Injection Apparatus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Courier New",Courier,monospace;
  background:#13111c;
  color:#e8e2f5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:2rem;
}
.wrap{text-align:center;max-width:480px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{font-size:3.5rem;font-weight:700;letter-spacing:0.08em;color:#b49ee0;margin-bottom:0.3rem}
.sub{font-size:0.82rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(180,160,220,0.5);margin-bottom:3rem}
.msg{font-size:0.88rem;color:rgba(232,226,245,0.45);line-height:1.8}
.msg strong{color:rgba(180,160,220,0.7);font-weight:normal}
.blink{display:inline-block;width:0.6em;height:1em;background:#b49ee0;opacity:0.7;vertical-align:text-bottom;animation:blink 1.1s step-end infinite}
@keyframes blink{0%,100%{opacity:0.7}50%{opacity:0}}
footer{font-size:0.72rem;color:rgba(180,160,220,0.3);padding-bottom:1.5rem;letter-spacing:0.05em}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">M.I.A.</div>
  <div class="sub">Mesh Injection Apparatus</div>
  <p class="msg">
    Full release after <strong>DEF CON 34</strong>.<br/>
    Documentation, hardware files, and firmware coming soon.<span class="blink"></span>
  </p>
</div>
<footer>Benito Sauceda &copy; 2026</footer>
</body>
</html>
